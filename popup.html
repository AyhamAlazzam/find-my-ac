<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 270px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #fdfdfd;
      color: #333;
    }
    .header-container {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;
      margin-bottom: 10px;
    }
    h3 {
      margin: 0;
      font-size: 15px;
      color: #2d3748;
    }
    .version-tag {
      font-size: 11px;
      color: #718096;
      font-weight: 500;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-top: 10px;
      color: #4a5568;
    }
    input {
      width: 100%;
      padding: 7px 9px;
      margin-top: 4px;
      box-sizing: border-box;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #3182ce;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 8px 10px;
      background-color: #3182ce;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      transition: background-color 0.25s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    #clearBtn {
      background-color: transparent;
      color: #e53e3e;
      border: 1px solid #fed7d7;
      margin-top: 8px;
      font-weight: normal;
      font-size: 12px;
    }
    #clearBtn:hover {
      background-color: #fff5f5;
      border-color: #feb2b2;
    }
    .btn-green {
      background-color: #38a169 !important;
    }
    .btn-red {
      background-color: #e53e3e !important;
    }
  </style>
</head>
<body>
  <div class="header-container">
    <h3>FindMyAC</h3>
    <span class="version-tag" id="appVersion"></span>
  </div>

  <label for="apiKey">API Key:</label>
  <input type="text" id="apiKey" placeholder="Paste your API Key" autocomplete="off">

  <label for="apiSecret">API Secret:</label>
  <input type="password" id="apiSecret" placeholder="Paste your API Secret" autocomplete="off">

  <button id="saveBtn">Save Settings</button>
  <button id="clearBtn">Clear Saved Data</button>

  <script src="popup.js"></script>
</body>
</html>
